production_non_claims:
- The package does not claim that a live official population, POI, rent, mobility, traffic, or listing connector is already complete.
- The package does not claim that HeatZone or SiteScore is production-ready.
- The package does not claim that existing opened_on data is authoritative or sufficient.
- The package does not claim that the current payback formula represents complete unit economics.
- The package does not grant legal approval for automated retrieval or publication.
