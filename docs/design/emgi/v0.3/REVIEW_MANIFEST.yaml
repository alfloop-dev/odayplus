binding_decisions:
- EMGI remains in the odayplus monorepo; oday-data-platform publishes versioned analytical contracts only.
- modules/external_data remains the source control plane; modules/market_intelligence is a new canonical market domain.
- Missing, partial, stale, unlicensed, unauthorized, quarantined, truncated, saturated, and source-error states never silently become zero.
- Zero aggregates require valid negative evidence and complete search or partition coverage.
- Provider, Dataset, DatasetVersion, Adapter, ContentBlob, Observation, SearchExecution, and DataProduct are separate identities.
- Owner, sharing, sensitivity, and purpose are orthogonal scope dimensions.
- Global and licensed-shared ingestion use governed scope principals, not fake tenant ownership.
- Feature, label, and training manifests are separate; runtime feature manifests never include future labels.
- Taiwan business dates use Asia/Taipei or the store-specific timezone, not UTC date truncation.
- Every relation has one authoritative writer and one declared grain.
- HeatZone and SiteScore baseline heuristics are shadow-only until v3 release gates pass.
- Physical feasibility and decision economics are independent hard gates from market potential.
- SiteScore v3 separates market potential, target-format counterfactual, ramp, cannibalization, economics, and decision policy.
- Data acquisition is value-of-information driven; paid nationwide sources are not prerequisites.
- Technical source readiness and policy readiness are separate.
- Source dependency is preserved so copied upstream observations are not counted as independent evidence.
- API, UI, tests, domains, and data products may start from contract fixtures in parallel with connectors.
