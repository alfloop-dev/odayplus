# ODay data-platform product contract pin
#
# Task ODP-XR-PRODUCT-CLIENT-001 / contract `odayplus.data-platform-product-client.v1`.
#
# odayplus consumes the *released* EMGI product package published by
# alfloop-dev/oday-data-platform (task XR-CONTRACTS-PRODUCT-001). This file is the pin:
# it names the exact release, the exact producer commit, the byte checksums of
# the vendored release artifacts, and the canonical digest of every contract
# schema the generated client is built from.
#
# Nothing here is a producer implementation table. `storage-schema.sql` and
# `relation-ownership.yaml` are deliberately absent: they are the producer's
# internal DDL and writer catalog, and copying them is forbidden.
#
# To move the pin: re-vendor the artifacts from the new producer commit,
# refresh the checksums and the [[contracts]] digests here, then regenerate the
# client with
#
#     uv run python -m packages.oday_data_product_contracts_client.codegen --write
#
# `tests/contract/test_oday_data_product_contract_pin.py` fails CI when any of those
# steps is skipped or when a product schema moved underneath the pin.

