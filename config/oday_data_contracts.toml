# ODay data-platform foundation contract pin
#
# Task ODP-XR-CLIENT-001 / contract `odayplus.data-platform-foundation-client.v1`.
#
# odayplus consumes the *released* EMGI foundation package published by
# alfloop-dev/oday-data-platform (task XR-CONTRACTS-001). This file is the pin:
# it names the exact release, the exact producer commit, the byte checksums of
# the vendored release artifacts, and the canonical digest of every contract
# schema the generated client is built from.
#
# Nothing here is a producer implementation table. `storage-schema.sql` and
# `relation-ownership.yaml` ship in the upstream release and are deliberately
# not vendored: they are the producer's internal DDL and writer catalog, and
# copying them is exactly what this task exists to stop.
#
# To move the pin: re-vendor the three artifacts from the new producer commit,
# refresh the checksums and the [[contracts]] digests here, then regenerate the
# client with
#
#     uv run python -m packages.oday_data_contracts_client.codegen --write
#
# `tests/contract/test_oday_data_contract_pin.py` fails CI when any of those
# steps is skipped or when a kernel/internal schema moved underneath the pin.

schema_version = 1
client_contract = "odayplus.data-platform-foundation-client.v1"

[release]
id = "oday-data-foundation-contracts.v0.4.1"
name = "oday-data-foundation-contracts"
type = "foundation"
semantic_version = "0.4.1"
status = "PUBLISHED"
content_digest = "22d71f4460db75dc8fb1f5bfe8cf253427af11954c8d68915935dfb47ffd87f6"
internal_registry_digest = "2bbef7c5075c2172b6ae7d6d7d8233277d05b113dbfc55e20927e53bd0b432f7"
owner_task_id = "XR-CONTRACTS-001"
published_at = "2026-08-14T14:40:00Z"

[source]
repository = "alfloop-dev/oday-data-platform"
branch = "dev"
commit_sha = "3f0bd995bbd2248a9cff9176f27ed0e39d25948f"
release_path = "contracts/releases/emgi/foundation"

[compatibility]
required_contract_id = "oday-data-foundation-contracts.v0.4.1"
required_semantic_version = "0.4.1"
required_compatibility_mode = "backward-compatible"
consumer_client_contract = "odayplus.data-platform-foundation-client.v1"
allow_breaking_change = false
supported_release_versions = ["0.4.0", "0.4.1"]
# Categories whose contracts are pinned individually below. A drift in any of
# them fails the contract test, and therefore CI.
enforced_categories = ["platform_foundation", "kernel", "manifests", "internal_analytical"]

[vendor]
release_root = "packages/oday_data_contracts_client/_release"
generated_root = "packages/oday_data_contracts_client/models"
# Upstream release artifacts vendored verbatim, with their published byte
# checksums from contracts/releases/emgi/foundation/checksums.sha256.

[vendor.artifacts]
"release.json" = "64a9e424829a574173ec96e8c3dd0052412b84f58bfb19b792a027bc5d375ee3"
"compatibility.json" = "b0a6c2ecd2cb75152abf52e258e07a280cbb6c939f808cbcb0aafd9908c0ee87"
"schemas.json" = "26ccbe17f8be954314482af2d18a519d8e7f7fe76ff4b4a67716e291c4ef2efe"

# Released artifacts this consumer must never vendor or copy.
[vendor.excluded]
"storage-schema.sql" = "producer PostgreSQL/PostGIS implementation tables"
"relation-ownership.yaml" = "producer relation ownership and writer catalog"

# Every pinned contract. `sha256` is the canonical digest of the schema
# document as published in the release catalog:
#   sha256(json.dumps(schema, sort_keys=True, separators=(",", ":")))

