version: 2

models:
  - name: candidate_site_view
    description: Candidate-site scoring and outcome view for SiteScore.
    columns:
      - name: view_name
        description: Model-ready view name.
        tests:
          - not_null
      - name: view_version
        description: Model-ready view contract version.
        tests:
          - not_null
      - name: entity_id
        description: Primary entity key (candidate site ID).
        tests:
          - not_null
      - name: feature_snapshot_time
        description: Point-in-time snapshot boundary for features.
        tests:
          - not_null
      - name: prediction_origin_time
        description: Prediction origin timestamp.
        tests:
          - not_null
      - name: source_snapshot_ids
        description: Canonical source table lineage array.
        tests:
          - not_null
      - name: data_quality_score
        description: Rule-derived quality score (1.0 for complete rent and geocode, 0.8 for rent only, 0.0 missing).
        tests:
          - not_null
      - name: confidence
        description: Nullable measurement representing minimum source confidence (least of listing confidence and geocode confidence); evaluates to NULL when source measurements are absent.
      - name: is_training_eligible
        description: Whether row is eligible for training based on positive rent and PIT creation time.
        tests:
          - not_null
      - name: is_scoring_eligible
        description: Whether row is eligible for scoring based on positive rent.
        tests:
          - not_null
      - name: exclusion_reason
        description: Machine-readable exclusion reason or empty string.
        tests:
          - not_null
      - name: candidate_site_id
        description: Unique candidate site identifier.
        tests:
          - not_null
      - name: listing_id
        description: Associated real estate listing identifier.
      - name: target_format_code
        description: Target store format code.
      - name: rent_amount
        description: Monthly rent amount in TWD.
      - name: area_ping
        description: Usable area in Taiwanese ping.
      - name: frontage_m
        description: Storefront width in meters.
      - name: floor
        description: Floor level.
      - name: utility_electricity_flag
        description: Commercial electricity availability flag.
      - name: utility_drainage_flag
        description: Water drainage availability flag.
      - name: utility_gas_flag
        description: Natural gas availability flag.
      - name: geocode_confidence
        description: Geocoding confidence score from address location.
      - name: h3_index
        description: H3 spatial index resolution 9.
      - name: rent_per_ping
        description: Derived unit rent per ping.
      - name: hard_rule_fail_reasons
        description: Array of hard feasibility rule failure reason codes.
        tests:
          - not_null

  - name: geo_grid_view
