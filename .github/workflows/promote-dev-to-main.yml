name: Promote dev to main

# Ladder step: dev -> main.
# When CI passes on dev, open (or reuse) an auto-merge PR from dev into main,
# unless a blocking label (hold-promote / regression) is present.
#
# Notes on tokens (see also .github/branch-protection/policy.json):
#   - PR create/merge run as a real user via secrets.PROMOTE_TOKEN, because the
#     org policy forbids the built-in GITHUB_TOKEN from creating/approving PRs.
#   - The `task-review-gate` required check is normally emitted per task by the
#     assigned reviewer. A dev->main promotion carries content that was already
#     reviewed on its task/* -> dev PRs, so this workflow stamps that gate on the
#     promotion head with the built-in GITHUB_TOKEN (posting a commit status is
#     NOT restricted by the org PR policy). The stamp is skipped when a blocking
#     label is present, preserving the manual brake.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Below this Git, actions/checkout silently falls back to a REST archive
      # that ignores the sparse deny, so the runner must refuse first.
      - name: Require sparse-capable Git before checkout
        run: |
          set -euo pipefail
          reported="$(git version)"
          # The action parses one line only; extra output sends it to the archive.
          test "$reported" = "${reported%%$'\n'*}"
          version="$(printf '%s\n' "$reported" | sed -n 's/^git version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "$version"
          test "$(printf '2.28\n%s\n' "$version" | sort -V | head -n1)" = 2.28

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/tests/sources/**
            !**/test_listing_production_asset.py*

      # Git path, tree and index metadata only; no denied body is ever opened.
      # Sparse checkout only stops materialization: rename detection could still
      # lazily fetch a tracked body, so a tracked entry at HEAD or at a commit this
      # job compares is refused here, before anything downstream can read it.
      # The deny is the shared protected body domain of worktree_cleanliness: the
      # root prefix stays refused when tracked, and every embedded copy of it (or
      # of a named asset) stays tracked but skip-worktree, absent, and identical
      # at both compared commits, proven from index flags and lstat alone.
      # Host Git config is excluded because hosted runners ship a global LFS
      # filter that is unrelated to this checkout and would always be refused.
      - name: Prove protected path stayed out of checkout
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          sys.path.append(".orchestrator")
          import worktree_cleanliness as wc

          denied = "tests/sources"
          root = Path.cwd()
          compare = os.environ.get("PROTECTED_COMPARE_SHAS")
          endpoints = [] if compare is None else compare.split()


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          patterns = Path(git("rev-parse", "--git-path", "info/sparse-checkout").strip()).read_text().split()
          index = git("ls-files", "-z", "--", f":(literal){denied}").split("\0")
          verdicts = [
              wc.inspect_protected_git_metadata(root, "HEAD", (denied,), worktree_path=root, check_index=True),
              *(wc.inspect_protected_git_metadata(root, sha, (denied,)) for sha in endpoints),
          ]
          body = wc.protected_body_checkout_refusal(root, prefixes=(denied,), require_sparse=True)
          domains = [wc.protected_body_tree_entries(root, sha, (denied,)) for sha in endpoints]
          failures = [
              label
              for label, failed in (
                  ("compared commits unresolved", compare is not None and (
                      len(endpoints) != 2 or not all(re.fullmatch("[0-9a-f]{40}", sha) for sha in endpoints)
                  )),
                  ("sparse checkout disabled", git("config", "--get", "core.sparseCheckout").strip() != "true"),
                  ("cone mode", git("config", "--type=bool", "--default", "false", "--get", "core.sparseCheckoutCone").strip() != "false"),
                  ("deny patterns changed", patterns != list(wc.protected_body_sparse_patterns((denied,)))),
                  ("blob filter changed", git("config", "--get", "remote.origin.partialclonefilter").strip() != "blob:none"),
                  ("denied path in index", any(index)),
                  ("denied path materialized", os.path.lexists(denied)),
                  (f"protected body domain: {body}", body is not None),
                  ("protected body domain unreadable at a compared commit", None in domains),
                  ("protected body domain differs between compared commits", len(set(domains)) > 1),
                  *((f"{verdict.reason}: {verdict.detail}", not verdict.ok) for verdict in verdicts),
                  *(
                      (f"denied path tracked at {verdict.detail}", wc._tree_entry(root, verdict.detail, denied) is not None)
                      for verdict in verdicts
                      if verdict.ok
                  ),
              )
              if failed
          ]
          if failures:
              raise SystemExit(f"Protected checkout denial failed: {failures}")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install production release gate dependencies
        run: npm ci

      # Green task/dev CI is necessary but never sufficient release authority.
      # This final boundary fails closed until the registry records authentic,
      # exact-candidate Gate 0-6 receipts and Human/Ops GO sign-off. The static
      # release packet check also retains exact-source E2E receipt validation.
      - name: Require final production release GO
        run: make product-release-gate EXPECTED_SHA="${{ github.event.workflow_run.head_sha }}"

      - name: Open or reuse promote PR (dev -> main)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          PROMOTION_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Nothing to promote if dev is not ahead of main.
          ahead=$(git rev-list --count origin/main.."$PROMOTION_SHA")
          if [ "$ahead" = "0" ]; then
            echo "dev is not ahead of main; nothing to promote."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head dev \
              --title "Promote dev -> main" \
              --body "Auto-promote: CI is green on dev ($ahead commit(s) ahead of main)." \
              --label auto-promote
            pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          fi

          labels=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,hold-promote,*|*,regression,*)
              echo "Promotion PR #$pr blocked by label(s): $labels"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          head=$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')
          if [ "$head" != "$PROMOTION_SHA" ]; then
            echo "::error::Promotion SHA drift detected! Validated CI SHA is $PROMOTION_SHA, but PR headRefOid is $head. Aborting promotion to prevent TOCTOU authorization of unvalidated commits."
            exit 1
          fi

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Stamp task-review-gate on promotion head
        if: ${{ steps.pr.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_head="${{ steps.pr.outputs.head }}"
          if [ "$pr_head" != "$PROMOTION_SHA" ]; then
            echo "::error::Stamp target SHA ($pr_head) does not match validated promotion SHA ($PROMOTION_SHA); aborting status stamp."
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${pr_head}" \
            -F state=success \
            -F context=task-review-gate \
            -F "description=dev->main promotion (PR #${{ steps.pr.outputs.pr }}): per-task reviews already satisfied on task/* PRs into dev"

      - name: Enable auto-merge
        if: ${{ steps.pr.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          # Auto-merge once main's required checks pass (no-op if already merging).
          gh pr merge "${{ steps.pr.outputs.pr }}" --auto --merge \
            || echo "Auto-merge not enabled; PR #${{ steps.pr.outputs.pr }} left open for manual merge."
