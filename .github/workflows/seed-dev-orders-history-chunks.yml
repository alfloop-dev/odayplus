name: seed-dev-orders-history-chunks

# Dev only: load an empty stretch of synthetic orders (see HIST_*) as
# consecutive 20-day real backfill runs in date order, so forecast horizon
# labels mature after their prediction origin (see driver docstring).
on:
  push:
    branches: [seed-dev-data-backfill]
    paths:
      - .github/workflows/seed-dev-orders-history-chunks.yml
      - .github/scripts/seed_dev_orders_history_chunks_driver.py
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  history-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: dev
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      DB_URL_SECRET: ${{ vars.ODAY_DATABASE_URL_SECRET }}
      ODP_DATA_MONGO_URI: ${{ secrets.ODP_DATA_MONGO_URI }}
      TARGET_TENANT: d4fe5181-da2c-5438-bd12-230036ea6f59
      HIST_START: '2025-09-15'
      HIST_END: '2026-01-14'
      GEN_AS_OF: '2026-11-11'
      CHUNK_DAYS: '20'
      DO_NOT_TRACK: '1'
      DLT__RUNTIME__DLTHUB_TELEMETRY: 'false'
      DLT__RUNTIME__LOG_LEVEL: 'WARNING'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project env (root deps) + Mongo deps
        env:
          UV_PYTHON: '3.12'
        run: |
          set -euo pipefail
          pip install uv
          uv sync --frozen
          uv pip install 'pymongo>=4.10,<5' dnspython

      - name: Start Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${CLOUD_SQL_INSTANCE}" &
          echo "proxy_pid=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Cloud SQL proxy is up"; break
            fi
            sleep 1
          done

      - name: Load earlier order history in date-ordered chunks
        run: |
          set -euo pipefail
          RAW_DB_URL="$(gcloud secrets versions access latest \
            --secret="${DB_URL_SECRET%%:*}" --project="${GCP_PROJECT}")"
          echo "::add-mask::${RAW_DB_URL}"
          export RAW_DB_URL
          PYTHONPATH="${GITHUB_WORKSPACE}" UV_PYTHON=3.12 \
            uv run --frozen python .github/scripts/seed_dev_orders_history_chunks_driver.py
