name: Dev matched credential consumer
# Explicit NATIVE CI INGRESS PROPOSAL, subject to independent security review of
# this whole source tree. Not foreground custody, not a secret writer/deployer.
# This workflow has no push/schedule trigger. Exact reviewed/current admitted
# dev source, fresh job AFTER the authenticated201 ACK and canonical full
# dev-admin checks are mandatory. Offline tests are never consumer evidence.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact already-admitted dev source; must equal this dev checkout
        required: true
        type: string
      manifest_digest:
        description: Exact current admitted dev-admin manifest digest
        required: true
        type: string
      source_pull:
        description: Merged independently approved whole-tree source PR
        required: true
        type: string
      reviewed_head:
        description: Exact independently reviewed source head, tree equal to candidate
        required: true
        type: string
permissions:
  contents: read
  actions: read
  deployments: read
  id-token: write
concurrency:
  group: dev-matched-credential-consumer
  cancel-in-progress: false
jobs:
  consume:
    if: github.repository == 'alfloop-dev/odayplus' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Frozen installation precedes ALL matched-bundle/identity-token ingress.
      - name: Install frozen runtime dependencies without credential projection
        run: uv sync --frozen --no-dev --python 3.12
      - name: Consume one native matched bundle in the trusted process
        env:
          # Only this step receives the native secret snapshot. The documented
          # trusted launch boundary includes runner->shell->this Python process.
          # Python removes bundle/invoker/all legacy env before observers/gate;
          # native read-only GH token alone is used by canonical GitHub helpers.
          ODP_DEV_ADMIN_CREDENTIAL_BUNDLE: ${{ secrets.ODP_DEV_ADMIN_CREDENTIAL_BUNDLE }}
          GH_TOKEN: ${{ github.token }}
          GOOGLE_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          SOURCE_PULL: ${{ inputs.source_pull }}
          REVIEWED_HEAD: ${{ inputs.reviewed_head }}
        run: |
          .venv/bin/python -m delivery_toolchain.release.consume_dev_smoke \
            --release-sha "$RELEASE_SHA" --manifest-digest "$MANIFEST_DIGEST" \
            --source-pull "$SOURCE_PULL" --reviewed-head "$REVIEWED_HEAD" \
            --output .odp_data/native-consumer/consumption.json
      - name: Retain allowlisted real consumer result only
        uses: actions/upload-artifact@v4
        with:
          name: dev-matched-credential-consumption-${{ github.run_id }}
          path: .odp_data/native-consumer/consumption.json
          if-no-files-found: error
          retention-days: 14
