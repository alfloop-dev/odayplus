name: Deploy/Verify Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Release SHA expected at /platform/version; defaults to the workflow SHA."
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.ODP_STAGING_DEPLOY_URL }}
    env:
      HAS_WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_AR_REPO: ${{ vars.GCP_AR_REPO }}
      GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      API_SERVICE: ${{ vars.ODP_CLOUD_RUN_API_SERVICE }}
      WEB_SERVICE: ${{ vars.ODP_CLOUD_RUN_WEB_SERVICE }}
      MIGRATION_JOB: ${{ vars.ODP_CLOUD_RUN_MIGRATION_JOB }}
      WORKER_JOB: ${{ vars.ODP_CLOUD_RUN_WORKER_JOB }}
      SCHEDULER_JOB: ${{ vars.ODP_CLOUD_RUN_SCHEDULER_JOB }}
      WORKER_SCHEDULE_NAME: ${{ vars.ODP_CLOUD_SCHEDULER_WORKER_TRIGGER }}
      SCHEDULER_SCHEDULE_NAME: ${{ vars.ODP_CLOUD_SCHEDULER_SCHEDULER_TRIGGER }}
      ODP_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ODP_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      ODP_CLOUD_SCHEDULER_SERVICE_ACCOUNT: ${{ vars.ODP_CLOUD_SCHEDULER_SERVICE_ACCOUNT }}
      ODP_WORKER_CRON: ${{ vars.ODP_WORKER_CRON }}
      ODP_SCHEDULER_CRON: ${{ vars.ODP_SCHEDULER_CRON }}
      ODP_SCHEDULER_TIME_ZONE: ${{ vars.ODP_SCHEDULER_TIME_ZONE }}
      ODP_SNAPSHOT_BUCKET: ${{ vars.ODP_SNAPSHOT_BUCKET }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      ODP_LISTING_PROVIDER_FEED_URL: ${{ vars.ODP_LISTING_PROVIDER_FEED_URL }}
      ODP_POI_PROVIDER_URL: ${{ vars.ODP_POI_PROVIDER_URL }}
      ODP_GEOCODE_PROVIDER_URL: ${{ vars.ODP_GEOCODE_PROVIDER_URL }}
      ODP_ADMIN_BOUNDARY_PROVIDER_URL: ${{ vars.ODP_ADMIN_BOUNDARY_PROVIDER_URL }}
      ODP_LISTING_PROVIDER_AUTH_STATUS: ${{ vars.ODP_LISTING_PROVIDER_AUTH_STATUS }}
      ODP_POI_PROVIDER_AUTH_STATUS: ${{ vars.ODP_POI_PROVIDER_AUTH_STATUS }}
      ODP_GEOCODE_PROVIDER_AUTH_STATUS: ${{ vars.ODP_GEOCODE_PROVIDER_AUTH_STATUS }}
      ODP_ADMIN_BOUNDARY_PROVIDER_AUTH_STATUS: ${{ vars.ODP_ADMIN_BOUNDARY_PROVIDER_AUTH_STATUS }}
      ODP_PRODUCTION_PROVIDER_IDS: ${{ vars.ODP_PRODUCTION_PROVIDER_IDS }}
      ODP_EXTERNAL_PROVIDER_PROBE_TIMEOUT_SECONDS: ${{ vars.ODP_EXTERNAL_PROVIDER_PROBE_TIMEOUT_SECONDS }}
      ODP_COMPETITOR_MANUAL_SOURCE_STATUS: disabled
      ODP_AUTH_ISSUER: ${{ vars.ODP_AUTH_ISSUER }}
      ODP_AUTH_AUDIENCES: ${{ vars.ODP_AUTH_AUDIENCES }}
      ODP_AUTH_JWKS_URI: ${{ vars.ODP_AUTH_JWKS_URI }}
      ODP_AUTH_PRINCIPAL_MAP_SECRET: ${{ vars.ODP_AUTH_PRINCIPAL_MAP_SECRET }}
      ODP_OPERATOR_SMOKE_SERVICE_ACCOUNT: ${{ vars.ODP_OPERATOR_SMOKE_SERVICE_ACCOUNT }}
      ODP_WEB_OIDC_ISSUER: ${{ vars.ODP_WEB_OIDC_ISSUER }}
      ODP_WEB_OIDC_CLIENT_ID: ${{ vars.ODP_WEB_OIDC_CLIENT_ID }}
      ODP_OPERATOR_SMOKE_ROLE: ${{ vars.ODP_OPERATOR_SMOKE_ROLE }}
      ODAY_DATABASE_URL_SECRET: ${{ vars.ODAY_DATABASE_URL_SECRET }}
      ODP_LISTING_PROVIDER_API_KEY_SECRET: ${{ vars.ODP_LISTING_PROVIDER_API_KEY_SECRET }}
      ODP_POI_PROVIDER_API_KEY_SECRET: ${{ vars.ODP_POI_PROVIDER_API_KEY_SECRET }}
      ODP_GEOCODE_PROVIDER_API_KEY_SECRET: ${{ vars.ODP_GEOCODE_PROVIDER_API_KEY_SECRET }}
      ODP_ADMIN_BOUNDARY_PROVIDER_TOKEN_SECRET: ${{ vars.ODP_ADMIN_BOUNDARY_PROVIDER_TOKEN_SECRET }}
      ODP_WEB_OIDC_CLIENT_SECRET_SECRET: ${{ vars.ODP_WEB_OIDC_CLIENT_SECRET_SECRET }}
      ODP_WEB_SESSION_SECRET_SECRET: ${{ vars.ODP_WEB_SESSION_SECRET_SECRET }}
      ODP_DEPLOY_ENV: staging
      ODAY_RELEASE_SHA: ${{ inputs.expected_sha || github.sha }}
      ODP_REQUIRE_LIVE_DATA: "true"
      ODP_DATA_BINDING_MODE: live
      ODP_PRODUCT_MODE: production
      ODP_FORECAST_ENGINE: ${{ vars.ODP_FORECAST_ENGINE }}
      ODP_FORECAST_MODEL: ${{ vars.ODP_FORECAST_MODEL }}
      ODP_EXTERNAL_PROVIDER_MODE: live
      ODP_PERSISTENCE: postgresql
      ODP_OBJECT_STORE: gcs
      ODP_SCHEDULED_INGESTION_TENANT_ID: ${{ vars.ODP_SCHEDULED_INGESTION_TENANT_ID || 'tenant-staging' }}
      ODP_TENANT_ID: ${{ vars.ODP_TENANT_ID || 'tenant-staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Secret Scan
        run: python3 scripts/security/secret_scan.py

      - name: Run Python SAST Scan
        run: python3 scripts/security/sast_scan.py

      - name: Generate SBOM
        run: python3 scripts/security/generate_sbom.py

      - name: Validate release authority, WIF, and live runtime
        run: |
          if [ "${ODAY_RELEASE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "Error: expected_sha must equal the checked-out workflow SHA." >&2
            exit 1
          fi
          if [ "${HAS_WIF}" != "true" ]; then
            echo "Error: Workload Identity Federation variables are required." >&2
            exit 1
          fi
          python3 scripts/deployment/validate_cloud_run_live_deployment.py preflight \
            --environment staging \
            --release-sha "${ODAY_RELEASE_SHA}" \
            --output .odp_data/deployment/cloud-run-preflight.json

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.HAS_WIF == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build, push, deploy, and verify Cloud Run
        env:
          IMAGE_TAG: staging-${{ github.sha }}
        run: ./scripts/deploy_cloud_run_waji.sh

      - name: Verify configured staging authority endpoint
        env:
          ODP_STAGING_DEPLOY_URL: ${{ vars.ODP_STAGING_DEPLOY_URL }}
          ODP_STAGING_API_URL: ${{ vars.ODP_STAGING_API_URL }}
          ODP_STAGING_SECRET_OWNER: ${{ vars.ODP_STAGING_SECRET_OWNER }}
        run: |
          python3 scripts/e2e/check_remote_staging_proof.py \
            --expected-sha "$ODAY_RELEASE_SHA" \
            --correlation-id "corr-staging-${GITHUB_RUN_ID}" \
            --output ".odp_data/remote-staging-proof/staging-${GITHUB_RUN_ID}.json"

      - name: Upload staging proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-staging-proof
          # ODP-DEPLOY-STAGING-JOB-RECEIPT-UPLOAD-001: `.odp_data/deployment/*.json`
          # is not recursive, so this artifact published the top-level reports and
          # silently dropped the migration/scheduler/worker Cloud Run Job receipts
          # `deploy_cloud_run_waji.sh` writes under `cloud-run-jobs/`. Deploy Dev
          # lost exactly those in run 30436771086 and was fixed in c7727020; this
          # is the same contract applied to staging, which has not yet reached the
          # Job stage (every run so far fails closed at the WIF gate) and so would
          # have lost its first real receipts the moment it did.
          #
          # An explicit allowlist rather than a recursive include: the same
          # directory holds the raw `gcloud run jobs describe` / `executions
          # describe` / `executions list` dumps (`*-job.json`, `*-execution.json`,
          # `*-execution-list.json`), which restate the deployed env block and its
          # secret selectors verbatim and must never leave the runner. Every file
          # named below is written by
          # `scripts/deployment/validate_cloud_run_live_deployment.py`,
          # `scripts/e2e/check_live_e2e_gate.py`, or
          # `scripts/e2e/check_remote_staging_proof.py`, and carries redacted
          # check results only. The staging proof keeps the run-scoped name the
          # checker step above writes. `tests/ops/test_deploy_workflow_contract.py`
          # holds both this list and Deploy Dev's to the receipts those scripts
          # actually produce.
          path: |
            .odp_data/deployment/cloud-run-preflight.json
            .odp_data/deployment/cloud-run-smoke.json
            .odp_data/deployment/cloud-run-migration-compatibility.json
            .odp_data/deployment/live-e2e-gate.json
            .odp_data/deployment/cloud-run-jobs/migration-validation.json
            .odp_data/deployment/cloud-run-jobs/scheduler-validation.json
            .odp_data/deployment/cloud-run-jobs/worker-validation.json
            .odp_data/remote-staging-proof/staging-${{ github.run_id }}.json
          if-no-files-found: ignore
