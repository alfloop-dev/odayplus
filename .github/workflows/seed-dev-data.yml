name: seed-dev-data

# One-off: load the sample Atlas Mongo into dev Cloud SQL core.* via the real
# data-plane backfill, then scope the bjoe734 demo account to the derived tenant.
on:
  push:
    branches: [seed-dev-data-backfill]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      DB_URL_SECRET: ${{ vars.ODAY_DATABASE_URL_SECRET }}
      ODP_DATA_MONGO_URI: ${{ secrets.ODP_DATA_MONGO_URI }}
      TARGET_TENANT: d4fe5181-da2c-5438-bd12-230036ea6f59
      BJOE_USERNAME: bjoe734
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install data-plane dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'dlt[postgres]>=1.20,<2' 'psycopg[binary,pool]>=3.2,<4' \
            'pymongo>=4.10,<5' dnspython

      - name: Start Cloud SQL Auth Proxy
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${CLOUD_SQL_INSTANCE}" &
          echo "proxy_pid=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Cloud SQL proxy is up"; break
            fi
            sleep 1
          done

      - name: Fetch dev DB URL and run backfill + wire tenant
        run: |
          set -euo pipefail
          RAW_DB_URL="$(gcloud secrets versions access latest \
            --secret="${DB_URL_SECRET%%:*}" --project="${GCP_PROJECT}")"
          echo "::add-mask::${RAW_DB_URL}"
          export RAW_DB_URL
          PYTHONPATH="${GITHUB_WORKSPACE}" python3 .github/scripts/seed_dev_backfill_driver.py
