name: Merge queue review gate

# `task-review-gate` is a required check that the assigned reviewer stamps onto
# a PR's head SHA (see scripts/ai_status.py). A merge queue does not test that
# SHA: it builds a temporary ref from the target branch plus the queued PRs and
# waits for the required checks to report against that new SHA. Nobody stamps
# the gate there, so without this workflow every queued PR would sit until it
# timed out and was ejected -- a queue that blocks every merge instead of
# speeding them up.
#
# This does not weaken the gate. It re-asserts it: the group is stamped success
# only when every PR inside it already carries a successful task-review-gate on
# its own head, which is exactly the reviewer approval the queue would otherwise
# discard. Any PR without one makes the whole group fail, so it is ejected
# rather than merged unreviewed.
#
# Same token reasoning as promote-dev-to-main.yml: posting a commit status is
# not restricted by the org policy that forbids GITHUB_TOKEN from creating or
# approving PRs.

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      # Below this Git, actions/checkout silently falls back to a REST archive
      # that ignores the sparse deny, so the runner must refuse first.
      - name: Require sparse-capable Git before checkout
        run: |
          set -euo pipefail
          reported="$(git version)"
          # The action parses one line only; extra output sends it to the archive.
          test "$reported" = "${reported%%$'\n'*}"
          version="$(printf '%s\n' "$reported" | sed -n 's/^git version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          test -n "$version"
          test "$(printf '2.28\n%s\n' "$version" | sort -V | head -n1)" = 2.28

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.merge_group.head_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/tests/sources
            !**/tests/sources/**
            !**/test_listing_production_asset.py*

      # Git path, tree and index metadata only; no denied body is ever opened.
      # Sparse checkout only stops materialization: rename detection could still
      # lazily fetch a tracked body, so a tracked entry at HEAD or at a commit this
      # job compares is refused here, before anything downstream can read it.
      # The deny is the shared protected body domain of worktree_cleanliness: the
      # root prefix stays refused when tracked, and every embedded copy of it (or
      # of a named asset) stays tracked but skip-worktree, absent, and identical
      # at both compared commits, proven from index flags and lstat alone.
      # Host Git config is excluded because hosted runners ship a global LFS
      # filter that is unrelated to this checkout and would always be refused.
      - name: Prove protected path stayed out of checkout
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          sys.path.append(".orchestrator")
          import worktree_cleanliness as wc

          denied = "tests/sources"
          root = Path.cwd()
          compare = os.environ.get("PROTECTED_COMPARE_SHAS")
          endpoints = [] if compare is None else compare.split()


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          patterns = Path(git("rev-parse", "--git-path", "info/sparse-checkout").strip()).read_text().split()
          index = git("ls-files", "-z", "--", f":(literal){denied}").split("\0")
          verdicts = [
              wc.inspect_protected_git_metadata(root, "HEAD", (denied,), worktree_path=root, check_index=True),
              *(wc.inspect_protected_git_metadata(root, sha, (denied,)) for sha in endpoints),
          ]
          body = wc.protected_body_checkout_refusal(root, prefixes=(denied,), require_sparse=True)
          domains = [wc.protected_body_tree_entries(root, sha, (denied,)) for sha in endpoints]
          failures = [
              label
              for label, failed in (
                  ("compared commits unresolved", compare is not None and (
                      len(endpoints) != 2 or not all(re.fullmatch("[0-9a-f]{40}", sha) for sha in endpoints)
                  )),
                  ("sparse checkout disabled", git("config", "--get", "core.sparseCheckout").strip() != "true"),
                  ("cone mode", git("config", "--type=bool", "--default", "false", "--get", "core.sparseCheckoutCone").strip() != "false"),
                  ("deny patterns changed", patterns != list(wc.protected_body_sparse_patterns((denied,)))),
                  ("blob filter changed", git("config", "--get", "remote.origin.partialclonefilter").strip() != "blob:none"),
                  ("denied path in index", any(index)),
                  ("denied path materialized", os.path.lexists(denied)),
                  (f"protected body domain: {body}", body is not None),
                  ("protected body domain unreadable at a compared commit", None in domains),
                  ("protected body domain differs between compared commits", len(set(domains)) > 1),
                  *((f"{verdict.reason}: {verdict.detail}", not verdict.ok) for verdict in verdicts),
                  *(
                      (f"denied path tracked at {verdict.detail}", wc._tree_entry(root, verdict.detail, denied) is not None)
                      for verdict in verdicts
                      if verdict.ok
                  ),
              )
              if failed
          ]
          if failures:
              raise SystemExit(f"Protected checkout denial failed: {failures}")
          PY

      - name: Re-assert task-review-gate for the queued PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -F state=failure \
              -F context=task-review-gate \
              -F description="$2" >/dev/null
            exit 1
          }

          # The queue ref is documented as
          #   refs/heads/gh-readonly-queue/<base>/pr-<number>-<base_sha>
          # and each entry gets its own checks_requested event naming its own
          # PR, so this identifies exactly the PR being admitted. Deriving PRs
          # from the group's commits instead does NOT work here: base-advance
          # merges put one commit into many branches, so
          # `commits/<sha>/pulls` returns unrelated PRs -- measured against this
          # repo, one head SHA resolved to four of them -- and requiring all of
          # their gates would eject a properly approved PR.
          pr="$(printf '%s' "$HEAD_REF" | sed -n 's#.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$#\1#p')"
          [ -n "$pr" ] || fail \
            "Could not read a PR number from merge group ref '${HEAD_REF}'." \
            "Unrecognised merge queue ref; refusing to stamp"

          pr_head="$(gh pr view "$pr" --json headRefOid --jq '.headRefOid')"
          state="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${pr_head}/status" \
              --jq '[.statuses[] | select(.context == "task-review-gate")] | first | .state // "missing"'
          )"
          echo "merge group ${HEAD_SHA:0:8} <- PR #${pr} (head ${pr_head:0:8}), task-review-gate=${state}"

          [ "$state" = "success" ] || fail \
            "PR #${pr} carries task-review-gate=${state} on its head ${pr_head}; it has not been approved by its assigned reviewer." \
            "PR #${pr} is not reviewer-approved (${state})"

          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -F state=success \
            -F context=task-review-gate \
            -F description="PR #${pr} approved by its assigned reviewer" >/dev/null
